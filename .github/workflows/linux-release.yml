name: Desktop release

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/installers/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: Linux · x86_64 installers
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.tools/linux-release-target
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libfuse2
      - run: pnpm install --frozen-lockfile
      - name: Cache native video tools
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/video-linux
          key: video-tools-ubuntu22-${{ runner.arch }}-${{ hashFiles('scripts/prepare-video-extractor.mjs', 'scripts/prepare-video-ffmpeg.mjs', 'scripts/prepare-video-js.mjs', 'scripts/video-tool-sources.mjs') }}
          restore-keys: video-tools-ubuntu22-${{ runner.arch }}-
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm run build:linux:release
      - name: Download and merge 1080p with the installed Debian tools
        run: |
          dpkg-deb -x artifacts/linux/*.deb "$RUNNER_TEMP/vd-deb"
          tools="$(find "$RUNNER_TEMP/vd-deb" -type d -path '*/binaries/video-linux')"
          python3 scripts/smoke-video-tools.py "$tools"
      - name: Collect corresponding video tool sources and build recipes
        run: node scripts/pack-video-tool-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: video-tool-sources
          path: artifacts/video-sources/VersaDown-video-tool-sources.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: artifacts/linux/*
          if-no-files-found: error

  windows-ffmpeg:
    name: Build Windows FFmpeg
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache the Windows FFmpeg binary and checksum
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries/video-windows/ffmpeg.exe
            src-tauri/binaries/video-windows/ffmpeg.exe.sha256
          key: win64-ffmpeg-jammy-mingw-${{ hashFiles('scripts/prepare-video-ffmpeg.mjs', 'scripts/video-tool-sources.mjs') }}
      - name: Verify cached FFmpeg or compile the pinned source
        run: |
          exe=src-tauri/binaries/video-windows/ffmpeg.exe
          if [[ -s "$exe" && -s "$exe.sha256" ]] && [[ "$(cat "$exe.sha256")" == "$(sha256sum "$exe" | cut -d' ' -f1)" ]]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 make xz-utils
          node scripts/prepare-video-ffmpeg.mjs --cross-windows-x64
          sha256sum "$exe" | cut -d' ' -f1 > "$exe.sha256"
      - name: Record verified PE for the native Windows job
        id: verify
        run: |
          exe=src-tauri/binaries/video-windows/ffmpeg.exe
          file "$exe" | grep -E 'PE32\+.*x86-64'
          echo "sha256=$(sha256sum "$exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ffmpeg-build-input
          path: src-tauri/binaries/video-windows/ffmpeg.exe
          if-no-files-found: error
          retention-days: 2

  windows:
    needs: windows-ffmpeg
    name: Windows · x86_64 installer
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.tools/release-target
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $packageVersion."
          }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg-build-input
          path: src-tauri/binaries/video-windows
      - name: Build Windows installer
        env:
          VD_WINDOWS_FFMPEG_SHA256: ${{ needs.windows-ffmpeg.outputs.sha256 }}
        run: pnpm run build:windows:installer
      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path '.tools/release-target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          New-Item -ItemType Directory -Force -Path 'artifacts/windows' | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination 'artifacts/windows'
          $installerName = $installers[0].Name
          $installerHash = (Get-FileHash -LiteralPath (Join-Path 'artifacts/windows' $installerName) -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'artifacts/windows/SHA256SUMS.windows'),
            "$installerHash  $installerName`n",
            [System.Text.Encoding]::ASCII
          )
      - name: Download and merge 1080p from a clean Windows installation
        shell: pwsh
        run: |
          $installer = (Get-ChildItem 'artifacts/windows/*.exe').FullName
          $destination = Join-Path $env:RUNNER_TEMP 'vd-installed'
          $setup = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$destination" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)." }
          python scripts/smoke-video-tools.py (Join-Path $destination 'binaries/video-windows')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-release
          path: artifacts/windows/*
          if-no-files-found: error

  macos:
    name: macOS · ${{ matrix.name }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            name: Apple Silicon (ARM64)
          - runner: macos-15-intel
            arch: x86_64
            name: Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check release versions
        shell: bash
        run: |
          node -e "const p=require('./package.json').version,t=require('./src-tauri/tauri.conf.json').version,fs=require('fs'),c=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)[1]; if(p!==t||p!==c) process.exit(1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          fi
      - run: pnpm install --frozen-lockfile
      - name: Test the bundled download engine
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test engine_binary --test aria2_live --test parser_policy --test window_config --test window_lifecycle --test engine_runtime --test ftp_download --test cloud_provider_contract --test aria2_bt --test magnet_metadata
      - name: Cache native video tools
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/video-macos
          key: video-tools-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-video-extractor.mjs', 'scripts/prepare-video-ffmpeg.mjs', 'scripts/prepare-video-js.mjs', 'scripts/video-tool-sources.mjs') }}
          restore-keys: video-tools-${{ matrix.runner }}-${{ runner.arch }}-
      - name: Build macOS packages
        # Tauri uses Developer ID and notarization credentials when supplied.
        # Without them the artifacts are unsigned developer distributions.
        env:
          VERSADOWN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          VERSADOWN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          VERSADOWN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSADOWN_APPLE_ID: ${{ secrets.APPLE_ID }}
          VERSADOWN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          VERSADOWN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            input="VERSADOWN_$name"
            if [[ -n "${!input}" ]]; then
              export "$name=${!input}"
            else
              unset "$name"
            fi
          done
          pnpm run build:macos:release
      - name: Check macOS native cookies and graceful quit
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-smoke --test macos_native_smoke
      - name: Smoke test the packaged application
        run: |
          app=src-tauri/target/release/bundle/macos/VersaDown.app
          python3 scripts/smoke-macos.py "$app"
          python3 scripts/smoke-video-tools.py "$app/Contents/Resources/binaries/video-macos"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: artifacts/macos-${{ matrix.arch }}/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-release
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-release
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-release
          path: artifacts/macos
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: video-tool-sources
          path: artifacts/video-sources
      - name: Publish GitHub Release after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts/linux
            sha256sum --check SHA256SUMS
          )
          (
            cd artifacts/windows
            sed -i 's/\r$//' SHA256SUMS.windows
            sha256sum --check SHA256SUMS.windows
          )
          (
            cd artifacts/macos
            sha256sum --check SHA256SUMS.macos-arm64
            sha256sum --check SHA256SUMS.macos-x86_64
          )
          assets=(artifacts/macos/*.dmg artifacts/macos/*.app.zip artifacts/macos/SHA256SUMS.macos-* artifacts/linux/*.deb artifacts/linux/*.rpm artifacts/linux/*.AppImage artifacts/linux/SHA256SUMS artifacts/windows/*.exe artifacts/windows/SHA256SUMS.windows artifacts/video-sources/VersaDown-video-tool-sources.tar.gz)
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if draft_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft_state" == true ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
