name: Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libfuse2
      - run: pnpm install --frozen-lockfile
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm run build:linux:release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: artifacts/linux/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-release
          path: artifacts/linux
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(artifacts/linux/*.deb artifacts/linux/*.rpm artifacts/linux/*.AppImage artifacts/linux/SHA256SUMS)
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if draft_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft_state" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft --generate-notes
          fi
