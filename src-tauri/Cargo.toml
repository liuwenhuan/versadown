[package]
name = "alldownloader"
version = "0.1.0"
description = "Local-first universal download manager"
authors = ["AllDownloader Build"]
edition = "2021"

[lib]
name = "alldownloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
async-trait = "0.1"
base64 = "0.22"
sha1 = "0.10"
hmac = "0.12"
httpdate = "1"
zeroize = "1"
md5 = "0.8"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
rand = "0.8"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
axum = "0.8"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
report-debug-tool = []
