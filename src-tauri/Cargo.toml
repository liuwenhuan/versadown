[package]
name = "alldownloader"
version = "0.1.0"
description = "Local-first universal download manager"
authors = ["AllDownloader Build"]
edition = "2021"

[lib]
name = "alldownloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
quick-xml = "0.42"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
async-trait = "0.1"
base64 = "0.22"
sha1 = { version = "0.10", features = ["compress"] }
sha2 = "0.10"
hmac = "0.12"
httpdate = "1"
time = "0.3"
zeroize = "1"
md5 = "0.8"
url = "2"
percent-encoding = "2"
suppaftp = { version = "11", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "test-util"] }
rand = "0.8"
rsa = "0.9"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell"] }
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
report-debug-tool = []

[patch.crates-io]
# Tao 0.36 includes a wider API change. Backport only the Windows DPI fix
# from tauri-apps/tao#1252 while keeping Tauri's 0.35 dependency contract.
tao = { path = "vendor/tao" }
