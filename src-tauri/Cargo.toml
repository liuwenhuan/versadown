[package]
name = "alldownloader"
version = "0.1.0"
description = "Local-first universal download manager"
authors = ["AllDownloader Build"]
edition = "2021"

[lib]
name = "alldownloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
report-debug-tool = []
