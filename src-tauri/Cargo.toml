[package]
name = "versadown"
version = "0.2.0"
description = "Local-first universal download manager"
authors = ["VersaDown Build"]
edition = "2021"

[lib]
name = "versadown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
quick-xml = "0.42"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
sha1 = { version = "0.10", features = ["compress"] }
sha2 = "0.10"
hmac = "0.12"
httpdate = "1"
time = "0.3"
zeroize = "1"
keyring = "4.2"
chacha20poly1305 = "0.11"
md5 = "0.8"
url = "2"
percent-encoding = "2"
suppaftp = { version = "11", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "test-util"] }
rand = "0.8"
rsa = "0.9"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }
tauri-plugin-notification = "2"
libloading = "0.7"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0.2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell"] }
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
report-debug-tool = []
# Quick Windows builds use this explicitly so their runnable artifact matches
# the release executable and does not allocate a console window.
gui-subsystem = []

# 日常可运行验证使用的中间配置。它与正式发布目标隔离，保留
# 增量编译，并以较低优化级别缩短 Rust 与链接阶段的耗时。
[profile.quick]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

# 正式发布产物优先体积和运行时优化。symbols 会移除 Rust 符号；
# Thin LTO 在体积/编译耗时之间保持适合桌面发布的平衡。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
incremental = false

[patch.crates-io]
# Tao 0.36 includes a wider API change. Backport only the Windows DPI fix
# from tauri-apps/tao#1252 while keeping Tauri's 0.35 dependency contract.
tao = { path = "vendor/tao" }
